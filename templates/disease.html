<!DOCTYPE html>
<html>
<head>
    <title>FarmSavior</title>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: url('{{ url_for("static", filename="bg2.jpeg") }}') center/cover no-repeat fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 110px; /* Increased */
        }
        header {
            width: 100%;
            background: rgba(27, 77, 47, 0.7);
            display: flex;
            align-items: center;
            padding: 18px 60px; /* Increased */
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 0 1px 8px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        header img {
            height: 72px;   /* Increased */
            width: 72px;    /* Increased */
            border-radius: 50%;
            object-fit: cover;
            margin-right: 25px; /* Increased */
        }
        header h1 {
            color: white;
            font-size: 2.8rem;  /* Increased */
            font-weight: bold;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.93); /* More solid for contrast */
            border-radius: 18px;
            padding: 50px 60px;      /* Increased */
            margin-top: 60px;        /* Increased */
            box-shadow: 0 8px 26px rgba(34, 74, 47, 0.17);
            max-width: 600px;        /* Increased */
            width: 96%;
        }
        h2 {
            margin-bottom: 34px;         /* Increased */
            font-weight: 700;
            color: #234a2f;
            font-size: 2.3rem;           /* Increased */
            text-align: center;
        }
        form label {
            font-weight: 600;
            font-size: 1.35rem;          /* Increased */
            display: block;
            margin-bottom: 14px;         /* Increased */
        }
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 20px 12px;          /* Increased */
            font-size: 1.2rem;           /* Increased */
            border-radius: 12px;         /* Increased */
            border: 1.5px solid #ccc;
            margin-bottom: 34px;         /* Increased */
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 20px 0;             /* Increased */
            background-color: #a8e6a1;
            border: none;
            border-radius: 100px;
            font-size: 1.5rem;           /* Increased */
            font-weight: bold;
            color: #1b4d2f;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        button:hover {
            background-color: #8cd68d;
            color: white;
            transform: scale(1.07);      /* Increased */
        }
        @media (max-width: 480px) {
            .container {
                padding: 16px;
                margin-top: 16px;
            }
            header {
                padding: 10px 10px;
            }
            header img {
                height: 42px;
                width: 42px;
                margin-right: 8px;
            }
            header h1 {
                font-size: 1.7rem;
            }
            h2 {
                font-size: 1.3rem;
            }
            input[type="file"], button {
                font-size: 1.0rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="FarmSavior Logo">
        <h1>FarmSavior</h1>
    </header>
    <div class="container">
        <h2>Upload Leaf Image</h2>
        <form method="POST" enctype="multipart/form-data">
            <label for="disease_image">Choose Image:</label>
            <input type="file" id="disease_image" name="disease_image" required>
            <button type="submit">Detect Disease</button>
        </form>
    </div>
</body>
</html>
