<!DOCTYPE html>
<html lang="en">
<head>
    <title>FarmSavior - Crop Yield Prediction</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Roboto', sans-serif;
            background: url('{{ url_for("static", filename="bg2.jpeg") }}') no-repeat center center fixed;
            background-size: cover;
            color: #1a2f1a;
        }

        header {
            display: flex;
            align-items: center;
            background: rgba(27, 77, 47, 0.9);
            padding: 12px 24px;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        header img {
            height: 40px;
            width: 40px;
            border-radius: 50%;
            margin-right: 16px;
        }

        header h1 {
            font-weight: 700;
            font-size: 1.6rem;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            max-width: 600px;
            margin: 140px auto 40px auto;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgb(34 74 47 / 0.25);
        }

        h2 {
            font-weight: 700;
            margin-bottom: 24px;
            color: #234A2F;
            font-size: 1.5rem;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #234A2F;
        }

        input[type=text],
        input[type=number] {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 20px;
            border: 1.5px solid #8DE09B;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            outline-color: #a8e6a1;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: #234A2F;
        }

        button {
            background-color: #a8e6a1;
            color: #1b4d2f;
            padding: 14px 26px;
            border: none;
            border-radius: 100px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #8cd68d;
            color: #fff;
            transform: scale(1.03);
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background-color: #e6f5e6;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #1b4d2f;
        }

        @media(max-width: 640px) {
            .container {
                margin: 110px 20px 30px;
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="FarmSavior Logo" />
        <h1>FarmSavior</h1>
    </header>

    <div class="container">
        <h2>Crop Yield Prediction</h2>

        <form method="POST">
            <label>Crop Name:</label>
            <input type="text" name="crop" placeholder="e.g., Wheat" required />

            <label>Crop Year:</label>
            <input type="number" name="year" placeholder="e.g., 2025" required />

            <label>Season:</label>
            <input type="text" name="season" placeholder="e.g., Kharif, Rabi" required />

            <label>State:</label>
            <input type="text" name="state" placeholder="e.g., Punjab" required />

            <label>Area (Hectares):</label>
            <input type="number" step="0.1" name="area" required />

            <label>Production (Metric Tons):</label>
            <input type="number" step="0.1" name="production" required />

            <label>Annual Rainfall (mm):</label>
            <input type="number" step="0.1" name="rainfall" required />

            <label>Fertilizer Used (kg):</label>
            <input type="number" step="0.1" name="fertilizer" required />

            <label>Pesticide Used (kg):</label>
            <input type="number" step="0.1" name="pesticide" required />

            <button type="submit">Predict Yield</button>
        </form>

        

    </div>

</body>
</html>
