<!DOCTYPE html>
<html lang="en">
<head>
    <title>FarmSavior</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: url('{{ url_for("static", filename="bg2.jpeg") }}') no-repeat center center fixed;
            background-size: cover;
            color: #234A2F;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 700;
            font-size: 1.8rem;
            background-color: rgba(27, 77, 47, 0.7);
            padding: 15px 30px;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        header::before {
            content: "";
            display: inline-block;
            width: 40px;
            height: 40px;
            background: url('{{ url_for("static", filename="logo.jpeg") }}') no-repeat center center;
            background-size: contain;
            border-radius: 50%;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            max-width: 720px;
            margin: 40px auto;
            padding: 30px 40px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            color: #234A2F;
        }

        h2 {
            font-weight: 700;
            margin-bottom: 16px;
            color: #1b4d2f;
        }

        p, ul {
            font-weight: 500;
            font-size: 18px;
            line-height: 1.7;
            text-align: justify;
            margin-bottom: 20px;
            color: #1a2f1a;
        }

        .yield-value {
            font-size: 28px;
            font-weight: bold;
            color: #1b4d2f;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-flex;
            background-color: #a8e6a1;
            color: #1b4d2f;
            padding: 12px 28px;
            border-radius: 100px;
            font-size: 19px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-decoration: none;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.25s ease;
            white-space: nowrap;
            margin-right: 10px;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #8cd68d;
            color: #fff;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px 15px;
                padding: 24px 20px;
            }
            header {
                font-size: 1.4rem;
                padding: 10px 20px;
            }
            .btn {
                font-size: 17px;
                padding: 10px 24px;
            }
        }
    </style>
</head>
<body>

    <header>FarmSavior</header>

    <div class="container">
        <h2>Crop Yield Prediction Result</h2>

        <p><strong>Crop:</strong> {{ crop }}</p>
        <p><strong>State:</strong> {{ state }}</p>
        <p><strong>Season:</strong> {{ season }}</p>
        <p><strong>Year:</strong> {{ year }}</p>


        <div class="yield-value">
            Predicted Yield: {{ prediction }} tons/hectare
        </div>

        <!-- PDF Download Button -->
        <form action="{{ url_for('download_yield_pdf') }}" method="post" style="display:inline-block;">
            <input type="hidden" name="crop" value="{{ crop }}">
            <input type="hidden" name="state" value="{{ state }}">
            <input type="hidden" name="season" value="{{ season }}">
            <input type="hidden" name="year" value="{{ year }}">
            <input type="hidden" name="prediction" value="{{ prediction }}">
            <button type="submit" class="btn">📥 Download Yield Report as PDF</button>
        </form>

        <a href="{{ url_for('yield_prediction') }}" class="btn">🔙 Predict Again</a>
        <a href="{{ url_for('index') }}" class="btn">🏠 Back Home</a>
    </div>

</body>
</html>
