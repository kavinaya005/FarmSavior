<!DOCTYPE html>
<html lang="en">
<head>
    <title>FarmSavior - Crop Recommendation</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Roboto', sans-serif;
            background: url('{{ url_for("static", filename="bg2.jpeg") }}') no-repeat center center fixed;
            background-size: cover;
            color: #1a2f1a;
        }

        header {
            display: flex;
            align-items: center;
            background: rgba(27, 77, 47, 0.9);
            padding: 12px 24px;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        header img {
            height: 40px;
            width: 40px;
            border-radius: 50%;
            margin-right: 16px;
        }

        header h1 {
            font-weight: 700;
            font-size: 1.6rem;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            max-width: 600px;
            margin: 140px auto 40px auto;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgb(34 74 47 / 0.25);
        }

        h2 {
            font-weight: 700;
            margin-bottom: 24px;
            color: #234A2F;
            font-size: 1.5rem;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #234A2F;
        }

        input[type=number] {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 20px;
            border: 1.5px solid #8DE09B;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            outline-color: #a8e6a1;
            transition: border-color 0.3s ease;
        }

        input[type=number]:focus {
            border-color: #234A2F;
        }

        button {
            background-color: #a8e6a1;
            color: #1b4d2f;
            padding: 14px 26px;
            border: none;
            border-radius: 100px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            width: 100%;
            max-width: 100%;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover, button:focus {
            background-color: #8cd68d;
            color: #fff;
            transform: scale(1.03);
            outline: none;
        }

        @media(max-width: 640px) {
            .container {
                margin: 110px 20px 30px;
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="FarmSavior Logo" />
        <h1>FarmSavior</h1>
    </header>

    <div class="container">
        <h2>Enter Soil & Climate Data</h2>
        <form method="POST">
            <label for="N">Nitrogen (N):</label>
            <input id="N" type="number" step="0.1" name="N" required />

            <label for="P">Phosphorus (P):</label>
            <input id="P" type="number" step="0.1" name="P" required />

            <label for="K">Potassium (K):</label>
            <input id="K" type="number" step="0.1" name="K" required />

            <label for="temperature">Temperature (°C):</label>
            <input id="temperature" type="number" step="0.1" name="temperature" required />

            <label for="humidity">Humidity (%):</label>
            <input id="humidity" type="number" step="0.1" name="humidity" required />

            <label for="ph">pH Value:</label>
            <input id="ph" type="number" step="0.1" name="ph" required />

            <label for="rainfall">Rainfall (mm):</label>
            <input id="rainfall" type="number" step="0.1" name="rainfall" required />

            <button type="submit">Recommend Crop</button>
        </form>
    </div>
</body>
</html>
